openapi: "3.1.0"
info:
  title: Camellia Harvest Gateway API
  version: "3.0.0"
  description: >
    External API served by the Go gateway for the camellia oleifera smart
    harvest system. The current baseline exposes system health, recognition,
    plot/tree archives, plot-level decision planning, and tree-level
    work-order execution through the gateway.

servers:
  - url: http://localhost:9000
    description: Local gateway

tags:
  - name: system
    description: System health and service readiness.
  - name: recognition
    description: Recognition requests proxied through the gateway.
  - name: decision
    description: Plot-level harvest path planning, observations, and tree-level recommendations.
  - name: operations
    description: Plot/tree archives and tree-level work-order execution workflows.

paths:
  /healthz:
    get:
      operationId: gatewayHealth
      summary: Aggregated gateway and upstream health
      tags: [system]
      security: []
      responses:
        "200":
          description: All systems healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GatewayHealthResponse"
        "503":
          description: Upstream degraded or unreachable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GatewayHealthResponse"

  /v1/health:
    get:
      operationId: upstreamHealth
      summary: Upstream recognition service health
      tags: [system]
      security: []
      responses:
        "200":
          description: Upstream health
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"

  /v1/recognition/image:
    post:
      operationId: recognizeImage
      summary: Single image recognition
      tags: [recognition]
      security:
        - ApiKeyAuth: []
        - BearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        "200":
          description: Recognition result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImageInferResponse"
        "400":
          description: Invalid image or request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Missing or invalid API key
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Forbidden by policy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "413":
          description: File too large
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: Recognition service unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/recognition/stream:
    get:
      operationId: recognizeStream
      summary: WebSocket streaming recognition
      tags: [recognition]
      security:
        - ApiKeyAuth: []
        - BearerAuth: []
      description: >
        WebSocket endpoint. Send binary frames (image bytes) to receive
        per-frame recognition envelopes. Send text "close", "stop", or "eos"
        to end the session. The server emits a final summary envelope when the
        stream closes.
      x-websocket-messages:
        - direction: server-to-client
          description: Per-frame recognition envelope.
          schema:
            $ref: "#/components/schemas/StreamFrameEnvelope"
        - direction: server-to-client
          description: Session summary envelope sent when stream closes.
          schema:
            $ref: "#/components/schemas/StreamSummaryEnvelope"
        - direction: server-to-client
          description: Non-fatal processing error envelope.
          schema:
            $ref: "#/components/schemas/StreamErrorEnvelope"

  /v1/decision/recommendation:
    post:
      operationId: createDecisionRecommendation
      summary: Build harvest recommendations from a recognition snapshot
      tags: [decision]
      security:
        - ApiKeyAuth: []
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DecisionSnapshotRequest"
      responses:
        "200":
          description: Decision recommendation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DecisionRecommendationResponse"
        "400":
          description: Invalid snapshot request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Missing or invalid API key
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Forbidden by policy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Decision history persistence failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/decision/history:
    get:
      operationId: listDecisionHistory
      summary: List recent decision recommendation history
      tags: [decision]
      security:
        - ApiKeyAuth: []
        - BearerAuth: []
      responses:
        "200":
          description: Recent decision history
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DecisionHistoryResponse"
        "401":
          description: Missing or invalid API key
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Forbidden by policy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Decision history read failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/decision/observations:
    post:
      operationId: createTreeObservation
      summary: Archive the latest recognition snapshot for a tree
      tags: [decision]
      security:
        - ApiKeyAuth: []
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ObservationCreateRequest"
      responses:
        "200":
          description: Tree observation saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TreeObservation"
        "400":
          description: Invalid observation payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Missing or invalid API key
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Forbidden by policy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Observation persistence failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    get:
      operationId: listTreeObservations
      summary: List archived observations for a tree
      tags: [decision]
      security:
        - ApiKeyAuth: []
        - BearerAuth: []
      parameters:
        - in: query
          name: tree_id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Tree observation history
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TreeObservationListResponse"
        "400":
          description: Missing tree_id
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Missing or invalid API key
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Forbidden by policy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Observation query failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/decision/plans:
    post:
      operationId: createDecisionPlan
      summary: Generate a plot-level harvest plan from the latest tree observations
      tags: [decision]
      security:
        - ApiKeyAuth: []
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePlanRequest"
      responses:
        "200":
          description: Plot-level decision plan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DecisionPlan"
        "400":
          description: Invalid plan request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Missing or invalid API key
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Forbidden by policy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Plan generation failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    get:
      operationId: listDecisionPlans
      summary: List plot-level decision plans
      tags: [decision]
      security:
        - ApiKeyAuth: []
        - BearerAuth: []
      parameters:
        - in: query
          name: plot_id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Plot decision plans
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DecisionPlanListResponse"
        "400":
          description: Missing plot_id
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Missing or invalid API key
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Forbidden by policy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Plan query failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/decision/plans/{plan_id}:
    patch:
      operationId: updateDecisionPlan
      summary: Apply manual overrides to a plot-level decision plan
      tags: [decision]
      security:
        - ApiKeyAuth: []
        - BearerAuth: []
      parameters:
        - in: path
          name: plan_id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdatePlanRequest"
      responses:
        "200":
          description: Updated decision plan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DecisionPlan"
        "400":
          description: Invalid override request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Missing or invalid API key
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Forbidden by policy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Plan update failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/operations/plots:
    post:
      operationId: createPlot
      summary: Create a plot archive
      tags: [operations]
      security:
        - ApiKeyAuth: []
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePlotRequest"
      responses:
        "200":
          description: Plot created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Plot"
        "400":
          description: Invalid plot payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Missing or invalid API key
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Forbidden by policy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Plot persistence failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    get:
      operationId: listPlots
      summary: List plot archives
      tags: [operations]
      security:
        - ApiKeyAuth: []
        - BearerAuth: []
      responses:
        "200":
          description: Plot archives
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlotListResponse"
        "401":
          description: Missing or invalid API key
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Forbidden by policy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Plot query failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/operations/trees:
    post:
      operationId: createTreeArchive
      summary: Create a tree archive
      tags: [operations]
      security:
        - ApiKeyAuth: []
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTreeRequest"
      responses:
        "200":
          description: Tree archive created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TreeArchive"
        "400":
          description: Invalid tree payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Missing or invalid API key
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Forbidden by policy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Tree persistence failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/operations/plots/{plot_id}/trees:
    get:
      operationId: listTreesByPlot
      summary: List tree archives in a plot
      tags: [operations]
      security:
        - ApiKeyAuth: []
        - BearerAuth: []
      parameters:
        - in: path
          name: plot_id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Tree archives
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TreeListResponse"
        "400":
          description: Missing plot_id
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Missing or invalid API key
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Forbidden by policy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Tree query failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/operations/trees/{tree_id}:
    patch:
      operationId: updateTreeArchive
      summary: Update a tree archive
      tags: [operations]
      security:
        - ApiKeyAuth: []
        - BearerAuth: []
      parameters:
        - in: path
          name: tree_id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateTreeRequest"
      responses:
        "200":
          description: Updated tree archive
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TreeArchive"
        "400":
          description: Invalid tree update payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Missing or invalid API key
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Forbidden by policy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Tree update failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/operations/work-orders:
    post:
      operationId: createWorkOrders
      summary: Create tree-level work orders from a decision plan
      tags: [operations]
      security:
        - ApiKeyAuth: []
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateWorkOrdersRequest"
      responses:
        "200":
          description: Work orders created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkOrderListResponse"
        "400":
          description: Invalid work-order request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Missing or invalid API key
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Forbidden by policy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Work-order creation failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    get:
      operationId: listWorkOrders
      summary: List tree-level work orders
      tags: [operations]
      security:
        - ApiKeyAuth: []
        - BearerAuth: []
      parameters:
        - in: query
          name: plot_id
          required: false
          schema:
            type: string
        - in: query
          name: status
          required: false
          schema:
            $ref: "#/components/schemas/WorkOrderStatus"
      responses:
        "200":
          description: Work orders
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkOrderListResponse"
        "400":
          description: Invalid work-order filters
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Missing or invalid API key
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Forbidden by policy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Work-order query failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/operations/work-orders/{work_order_id}:
    patch:
      operationId: updateWorkOrder
      summary: Update a tree-level work order status
      tags: [operations]
      security:
        - ApiKeyAuth: []
        - BearerAuth: []
      parameters:
        - in: path
          name: work_order_id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateWorkOrderRequest"
      responses:
        "200":
          description: Updated work order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkOrder"
        "400":
          description: Invalid work-order update payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Missing or invalid API key
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Forbidden by policy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Work-order update failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
    BearerAuth:
      type: http
      scheme: bearer

  schemas:
    Detection:
      type: object
      required: [bbox, class_name, confidence]
      properties:
        bbox:
          type: array
          items:
            type: number
          minItems: 4
          maxItems: 4
        class_name:
          type: string
          enum: [camellia_oleifera_fruit]
        confidence:
          type: number
          minimum: 0
          maximum: 1
        track_id:
          type: integer
          nullable: true
        ripeness:
          type: string
          nullable: true
          enum: [harvestable, not_ready, occluded_unclear]

    FrameSummary:
      type: object
      required: [total]
      properties:
        total:
          type: integer

    FrameResult:
      type: object
      required: [frame_index, timestamp_ms, detections, frame_summary]
      properties:
        frame_index:
          type: integer
          minimum: 0
        timestamp_ms:
          type: integer
          minimum: 0
        detections:
          type: array
          items:
            $ref: "#/components/schemas/Detection"
        frame_summary:
          $ref: "#/components/schemas/FrameSummary"

    SessionSummary:
      type: object
      required: [total_detected]
      properties:
        total_detected:
          type: integer

    DecisionZone:
      type: string
      enum:
        - upper_left
        - upper_center
        - upper_right
        - middle_left
        - middle_center
        - middle_right
        - lower_left
        - lower_center
        - lower_right

    SkipReason:
      type: string
      enum: [not_ready, occluded_unclear, manual_skip]

    TreeRecommendationStatus:
      type: string
      enum: [ready, pending_observation]

    TreeStatus:
      type: string
      enum: [active, disabled]

    WorkOrderStatus:
      type: string
      enum: [pending, in_progress, completed, skipped]

    DecisionSnapshotRequest:
      type: object
      required: [frame_index, timestamp_ms, frame_width, frame_height, detections]
      properties:
        frame_index:
          type: integer
          minimum: 0
        timestamp_ms:
          type: integer
          minimum: 0
        frame_width:
          type: integer
          minimum: 1
        frame_height:
          type: integer
          minimum: 1
        detections:
          type: array
          items:
            $ref: "#/components/schemas/Detection"

    DecisionSummary:
      type: object
      required: [total_detections, harvestable_count, skipped_count, estimated_path_length]
      properties:
        total_detections:
          type: integer
          minimum: 0
        harvestable_count:
          type: integer
          minimum: 0
        skipped_count:
          type: integer
          minimum: 0
        main_priority_zone:
          type: string
          nullable: true
          enum:
            - upper_left
            - upper_center
            - upper_right
            - middle_left
            - middle_center
            - middle_right
            - lower_left
            - lower_center
            - lower_right
        estimated_path_length:
          type: number
          minimum: 0

    ZonePriority:
      type: object
      required: [order, zone, harvestable_count, distance_to_start, note]
      properties:
        order:
          type: integer
          minimum: 1
        zone:
          type: string
          enum:
            - upper_left
            - upper_center
            - upper_right
            - middle_left
            - middle_center
            - middle_right
            - lower_left
            - lower_center
            - lower_right
        harvestable_count:
          type: integer
          minimum: 0
        distance_to_start:
          type: number
          minimum: 0
        note:
          type: string

    PickSequenceItem:
      type: object
      required: [order, detection_index, zone, confidence, reason]
      properties:
        order:
          type: integer
          minimum: 1
        detection_index:
          type: integer
          minimum: 0
        track_id:
          type: integer
          nullable: true
        zone:
          type: string
          enum:
            - upper_left
            - upper_center
            - upper_right
            - middle_left
            - middle_center
            - middle_right
            - lower_left
            - lower_center
            - lower_right
        confidence:
          type: number
          minimum: 0
          maximum: 1
        reason:
          type: string

    SkipItem:
      type: object
      required: [detection_index, zone, skip_reason, confidence, reason]
      properties:
        detection_index:
          type: integer
          minimum: 0
        track_id:
          type: integer
          nullable: true
        zone:
          type: string
          enum:
            - upper_left
            - upper_center
            - upper_right
            - middle_left
            - middle_center
            - middle_right
            - lower_left
            - lower_center
            - lower_right
        skip_reason:
          type: string
          enum: [not_ready, occluded_unclear, manual_skip]
        confidence:
          type: number
          minimum: 0
          maximum: 1
        reason:
          type: string

    DecisionRecommendationResponse:
      type: object
      required: [decision_id, created_at, summary, zone_priorities, pick_sequence, skip_items]
      properties:
        decision_id:
          type: string
        created_at:
          type: string
