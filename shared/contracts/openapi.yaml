openapi: "3.1.0"
info:
  title: Camellia Harvest Gateway API
  version: "2.0.0"
  description: >
    External API served by the Go gateway for the camellia oleifera smart
    harvest system. The current executable baseline exposes system health
    checks and recognition endpoints, while decision and operations domains
    are reserved for later expansion.

servers:
  - url: http://localhost:9000
    description: Local gateway

tags:
  - name: system
    description: System health and service readiness.
  - name: recognition
    description: Recognition requests proxied through the gateway.
  - name: decision
    description: Reserved for harvest path and work-order decisions.
  - name: operations
    description: Reserved for field operations and management workflows.

paths:
  /healthz:
    get:
      operationId: gatewayHealth
      summary: Aggregated gateway and upstream health
      tags: [system]
      security: []
      responses:
        "200":
          description: All systems healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GatewayHealthResponse"
        "503":
          description: Upstream degraded or unreachable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GatewayHealthResponse"

  /v1/health:
    get:
      operationId: upstreamHealth
      summary: Upstream recognition service health
      tags: [system]
      security: []
      responses:
        "200":
          description: Upstream health
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"

  /v1/recognition/image:
    post:
      operationId: recognizeImage
      summary: Single image recognition
      tags: [recognition]
      security:
        - ApiKeyAuth: []
        - BearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        "200":
          description: Recognition result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImageInferResponse"
        "400":
          description: Invalid image or request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Missing or invalid API key
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Forbidden by policy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "413":
          description: File too large
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: Recognition service unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/recognition/stream:
    get:
      operationId: recognizeStream
      summary: WebSocket streaming recognition
      tags: [recognition]
      security:
        - ApiKeyAuth: []
        - BearerAuth: []
      description: >
        WebSocket endpoint. Send binary frames (image bytes) to receive
        per-frame recognition envelopes. Send text "close", "stop", or "eos"
        to end the session. The server emits a final summary envelope when the
        stream closes.
      x-websocket-messages:
        - direction: server-to-client
          description: Per-frame recognition envelope.
          schema:
            $ref: "#/components/schemas/StreamFrameEnvelope"
        - direction: server-to-client
          description: Session summary envelope sent when stream closes.
          schema:
            $ref: "#/components/schemas/StreamSummaryEnvelope"
        - direction: server-to-client
          description: Non-fatal processing error envelope.
          schema:
            $ref: "#/components/schemas/StreamErrorEnvelope"

  /v1/decision/recommendation:
    post:
      operationId: createDecisionRecommendation
      summary: Build harvest recommendations from a recognition snapshot
      tags: [decision]
      security:
        - ApiKeyAuth: []
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DecisionSnapshotRequest"
      responses:
        "200":
          description: Decision recommendation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DecisionRecommendationResponse"
        "400":
          description: Invalid snapshot request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Missing or invalid API key
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Forbidden by policy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Decision history persistence failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/decision/history:
    get:
      operationId: listDecisionHistory
      summary: List recent decision recommendation history
      tags: [decision]
      security:
        - ApiKeyAuth: []
        - BearerAuth: []
      responses:
        "200":
          description: Recent decision history
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DecisionHistoryResponse"
        "401":
          description: Missing or invalid API key
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Forbidden by policy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Decision history read failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
    BearerAuth:
      type: http
      scheme: bearer

  schemas:
    Detection:
      type: object
      required: [bbox, class_name, confidence]
      properties:
        bbox:
          type: array
          items:
            type: number
          minItems: 4
          maxItems: 4
        class_name:
          type: string
          enum: [camellia_oleifera_fruit]
        confidence:
          type: number
          minimum: 0
          maximum: 1
        track_id:
          type: integer
          nullable: true
        ripeness:
          type: string
          nullable: true
          enum: [harvestable, not_ready, occluded_unclear]

    FrameSummary:
      type: object
      required: [total]
      properties:
        total:
          type: integer

    FrameResult:
      type: object
      required: [frame_index, timestamp_ms, detections, frame_summary]
      properties:
        frame_index:
          type: integer
          minimum: 0
        timestamp_ms:
          type: integer
          minimum: 0
        detections:
          type: array
          items:
            $ref: "#/components/schemas/Detection"
        frame_summary:
          $ref: "#/components/schemas/FrameSummary"

    SessionSummary:
      type: object
      required: [total_detected]
      properties:
        total_detected:
          type: integer

    DecisionSnapshotRequest:
      type: object
      required: [frame_index, timestamp_ms, frame_width, frame_height, detections]
      properties:
        frame_index:
          type: integer
          minimum: 0
        timestamp_ms:
          type: integer
          minimum: 0
        frame_width:
          type: integer
          minimum: 1
        frame_height:
          type: integer
          minimum: 1
        detections:
          type: array
          items:
            $ref: "#/components/schemas/Detection"

    DecisionSummary:
      type: object
      required: [total_detections, harvestable_count, skipped_count, estimated_path_length]
      properties:
        total_detections:
          type: integer
          minimum: 0
        harvestable_count:
          type: integer
          minimum: 0
        skipped_count:
          type: integer
          minimum: 0
        main_priority_zone:
          type: string
          nullable: true
          enum:
            - upper_left
            - upper_center
            - upper_right
            - middle_left
            - middle_center
            - middle_right
            - lower_left
            - lower_center
            - lower_right
        estimated_path_length:
          type: number
          minimum: 0

    ZonePriority:
      type: object
      required: [order, zone, harvestable_count, distance_to_start, note]
      properties:
        order:
          type: integer
          minimum: 1
        zone:
          type: string
          enum:
            - upper_left
            - upper_center
            - upper_right
            - middle_left
            - middle_center
            - middle_right
            - lower_left
            - lower_center
            - lower_right
        harvestable_count:
          type: integer
          minimum: 0
        distance_to_start:
          type: number
          minimum: 0
        note:
          type: string

    PickSequenceItem:
      type: object
      required: [order, detection_index, zone, confidence, reason]
      properties:
        order:
          type: integer
          minimum: 1
        detection_index:
          type: integer
          minimum: 0
        track_id:
          type: integer
          nullable: true
        zone:
          type: string
          enum:
            - upper_left
            - upper_center
            - upper_right
            - middle_left
            - middle_center
            - middle_right
            - lower_left
            - lower_center
            - lower_right
        confidence:
          type: number
          minimum: 0
          maximum: 1
        reason:
          type: string

    SkipItem:
      type: object
      required: [detection_index, zone, skip_reason, confidence, reason]
      properties:
        detection_index:
          type: integer
          minimum: 0
        track_id:
          type: integer
          nullable: true
        zone:
          type: string
          enum:
            - upper_left
            - upper_center
            - upper_right
            - middle_left
            - middle_center
            - middle_right
            - lower_left
            - lower_center
            - lower_right
        skip_reason:
          type: string
          enum: [not_ready, occluded_unclear]
        confidence:
          type: number
          minimum: 0
          maximum: 1
        reason:
          type: string

    DecisionRecommendationResponse:
      type: object
      required: [decision_id, created_at, summary, zone_priorities, pick_sequence, skip_items]
      properties:
        decision_id:
          type: string
        created_at:
          type: string
          format: date-time
        summary:
          $ref: "#/components/schemas/DecisionSummary"
        zone_priorities:
          type: array
          items:
            $ref: "#/components/schemas/ZonePriority"
        pick_sequence:
          type: array
          items:
            $ref: "#/components/schemas/PickSequenceItem"
        skip_items:
          type: array
          items:
            $ref: "#/components/schemas/SkipItem"

    DecisionHistoryItem:
      type: object
      required: [decision_id, created_at, request, summary, zone_priorities, pick_sequence, skip_items]
      properties:
        decision_id:
          type: string
        created_at:
          type: string
          format: date-time
        request:
          $ref: "#/components/schemas/DecisionSnapshotRequest"
        summary:
          $ref: "#/components/schemas/DecisionSummary"
        zone_priorities:
          type: array
          items:
            $ref: "#/components/schemas/ZonePriority"
        pick_sequence:
          type: array
          items:
            $ref: "#/components/schemas/PickSequenceItem"
        skip_items:
          type: array
          items:
            $ref: "#/components/schemas/SkipItem"

    DecisionHistoryResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/DecisionHistoryItem"

    ModelMeta:
      type: object
      required: [model_version, schema_version, adapter, loaded, ripeness_enabled, ripeness_loaded]
      properties:
        model_version:
          type: string
        schema_version:
          type: string
        adapter:
          type: string
        loaded:
          type: boolean
        load_error:
          type: string
          nullable: true
        ripeness_enabled:
          type: boolean
        ripeness_adapter:
          type: string
          nullable: true
        ripeness_loaded:
          type: boolean
        ripeness_error:
          type: string
          nullable: true

    HealthResponse:
      type: object
      required: [status, model]
      properties:
        status:
          type: string
        model:
          $ref: "#/components/schemas/ModelMeta"

    ImageInferResponse:
      type: object
      required: [model_version, schema_version, inference_ms, result]
      properties:
        model_version:
          type: string
        schema_version:
          type: string
        inference_ms:
          type: number
        result:
          $ref: "#/components/schemas/FrameResult"

    StreamFrameEnvelope:
      type: object
      required: [type, model_version, schema_version, result]
      properties:
        type:
          type: string
          enum: [frame]
        model_version:
          type: string
        schema_version:
          type: string
        result:
          $ref: "#/components/schemas/FrameResult"

    StreamSummaryEnvelope:
      type: object
      required: [type, model_version, schema_version, summary]
      properties:
        type:
          type: string
          enum: [summary]
        model_version:
          type: string
        schema_version:
          type: string
        summary:
          $ref: "#/components/schemas/SessionSummary"

    StreamErrorEnvelope:
      type: object
      required: [type, detail]
      properties:
        type:
          type: string
          enum: [error]
        detail:
          type: string

    GatewayHealthResponse:
      type: object
      required: [status, gateway]
      properties:
        status:
          type: string
          enum: [ok, degraded]
        gateway:
          type: string
        upstream:
          $ref: "#/components/schemas/HealthResponse"
        error:
          type: string

    ErrorResponse:
      type: object
      required: [error, message]
      properties:
        error:
          type: string
        message:
          type: string
        request_id:
          type: string
        details:
          type: object
          additionalProperties: true
