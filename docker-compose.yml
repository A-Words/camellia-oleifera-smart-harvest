services:
  recognition-api:
    build:
      context: .
      dockerfile: tooling/docker/Dockerfile
    ports:
      - "8000:8000"
    environment:
      - CAMELLIA_RECOGNITION_CONFIG=/workspace/tooling/config/recognition.yaml
      - CAMELLIA_SERVICE_CONFIG=/workspace/tooling/config/service.yaml
    volumes:
      - ./mlops/artifacts:/workspace/mlops/artifacts

  gateway:
    build:
      context: .
      dockerfile: tooling/docker/Dockerfile.gateway
    ports:
      - "9000:9000"
    environment:
      - CAMELLIA_GATEWAY_CONFIG=/etc/gateway/gateway.yaml
    volumes:
      - ./tooling/config:/etc/gateway:ro
    depends_on:
      - recognition-api
